<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POOM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #F7F0EB;
      --white: #FFFFFF;
      --accent: #F4846A;
      --accent-light: #FDEAE5;
      --text: #1A1A1A;
      --text-sub: #888888;
      --text-muted: #BBBBBB;
      --border: #E8DDD6;
      --bubble: #8CA0B3;
      --radius-lg: 20px;
      --radius-pill: 99px;
    }

    body {
      font-family: 'Arita-dotum', 'Arita dotum', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Screens ── */
    .screen { display: none; min-height: 100vh; padding-bottom: 96px; }
    .screen.active { display: block; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px 12px;
      position: sticky; top: 0; background: var(--bg); z-index: 50;
    }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .header-icons { display: flex; gap: 18px; align-items: center; }
    .header-icons svg { width: 22px; height: 22px; cursor: pointer; stroke: var(--text); }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed; bottom: 14px;
      left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 398px;
      background: var(--white); border-radius: var(--radius-pill);
      padding: 8px 12px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10); z-index: 100;
    }
    .nav-group { display: flex; gap: 2px; }
    .nav-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 10px 14px; border-radius: var(--radius-pill);
      border: none; background: transparent; cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 500;
      color: var(--text-sub); transition: all .18s;
    }
    .nav-btn.active { background: var(--bg); color: var(--text); }
    .nav-btn svg { width: 18px; height: 18px; stroke: currentColor; }
    .nav-add {
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--text); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .nav-add:active { opacity: .8; }
    .nav-add svg { width: 22px; height: 22px; }

    /* ── Buttons ── */
    .btn-outline {
      flex: 1; padding: 12px; border-radius: var(--radius-pill);
      border: 1.5px solid var(--border); background: transparent;
      font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; color: var(--text); transition: opacity .15s;
    }
    .btn-fill {
      flex: 1; padding: 12px; border-radius: var(--radius-pill);
      border: none; background: var(--accent);
      font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; color: white; transition: opacity .15s;
    }
    .btn-outline:active, .btn-fill:active { opacity: .8; }
    .btn-primary {
      width: 100%; padding: 16px; border-radius: var(--radius-pill);
      border: none; background: var(--accent);
      font-family: inherit; font-size: 16px; font-weight: 600;
      cursor: pointer; color: white; transition: opacity .15s;
    }
    .btn-primary:active { opacity: .85; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Home ── */
    .hero-card {
      background: var(--white); border-radius: var(--radius-lg);
      margin: 8px 16px 24px; padding: 28px 24px 22px;
      cursor: pointer; transition: opacity .18s;
    }
    .hero-card:active { opacity: .8; }
    .hero-title { font-size: 22px; font-weight: 700; line-height: 1.4; margin-bottom: 6px; }
    .hero-sub { font-size: 14px; color: var(--text-sub); }
    .hero-arrow { display: flex; justify-content: flex-end; margin-top: 18px; }
    .hero-arrow svg { width: 22px; height: 22px; stroke: var(--text-sub); }
    .section-title { font-size: 17px; font-weight: 700; padding: 0 16px; margin-bottom: 12px; }

    /* ── Message Card ── */
    .msg-card {
      background: var(--white); border-radius: var(--radius-lg);
      margin: 0 16px 12px; overflow: hidden;
      cursor: pointer; transition: opacity .18s;
    }
    .msg-card:active { opacity: .85; }
    .msg-preview { background: var(--bubble); padding: 16px 16px 12px; }
    .msg-preview-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px 10px 0 0; display: block; }
    .msg-sender-label { font-size: 12px; color: rgba(255,255,255,.75); margin-bottom: 8px; }
    .chat-bubble {
      background: var(--white); border-radius: 4px 16px 16px 16px;
      padding: 9px 14px; margin-bottom: 6px;
      font-size: 13px; line-height: 1.55; color: var(--text);
      display: inline-block; max-width: 92%;
    }
    .chat-time { font-size: 11px; color: rgba(255,255,255,.5); text-align: right; margin-top: 4px; }
    .msg-footer { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .msg-footer-sender { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-sub); }
    .msg-footer-sender svg { width: 13px; height: 13px; stroke: var(--text-sub); }
    .msg-footer-date { font-size: 12px; color: var(--text-sub); }

    /* ── Empty ── */
    .empty { display: flex; flex-direction: column; align-items: center; padding: 40px 24px; gap: 10px; text-align: center; }
    .empty-sub { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

    /* ── Library ── */
    .lib-header { padding: 16px 16px 12px; }
    .lib-count { font-size: 24px; font-weight: 700; line-height: 1.35; }
    .lib-count span { color: var(--accent); }
    .active-folder { background: var(--white); border-radius: var(--radius-lg); margin: 0 16px 12px; padding: 20px; }
    .folder-label { font-size: 12px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .folder-label svg { width: 13px; height: 13px; stroke: var(--text-sub); }
    .folder-name { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    .folder-big-count { font-size: 34px; font-weight: 700; text-align: center; margin: 12px 0 18px; }
    .folder-big-count span { font-size: 15px; font-weight: 400; color: var(--text-sub); }
    .folder-actions { display: flex; gap: 10px; }
    .folder-item {
      background: var(--white); border-radius: var(--radius-lg);
      margin: 0 16px 10px; padding: 18px 20px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; transition: opacity .15s;
    }
    .folder-item:active { opacity: .8; }
    .folder-item-name { font-size: 15px; font-weight: 500; }
    .folder-item-count { font-size: 14px; color: var(--text-sub); }

    /* ── Search ── */
    .search-wrap { padding: 8px 16px 0; }
    .search-bar-wrap {
      display: flex; align-items: center; gap: 10px;
      background: var(--white); border-radius: var(--radius-pill);
      padding: 14px 20px;
    }
    .search-bar-wrap input {
      border: none; outline: none; font-family: inherit; font-size: 15px;
      background: transparent; flex: 1; color: var(--text);
    }
    .search-bar-wrap input::placeholder { color: var(--text-muted); }
    .search-bar-wrap svg { width: 18px; height: 18px; stroke: var(--text-muted); flex-shrink: 0; }
    .search-hint {
      font-size: 12px; color: var(--text-sub); line-height: 1.6;
      padding: 10px 20px 0; display: flex; align-items: flex-start; gap: 4px; justify-content: center;
    }
    .search-hint svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 2px; stroke: var(--text-muted); }
    .search-empty-wrap { display: flex; flex-direction: column; align-items: center; padding: 32px; }
    .search-result-label { font-size: 13px; color: var(--text-sub); padding: 12px 16px 8px; }
    .search-list { background: var(--white); border-radius: var(--radius-lg); margin: 0 16px; overflow: hidden; }
    .search-list-item {
      display: flex; gap: 12px; padding: 14px 16px;
      border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity .15s;
    }
    .search-list-item:last-child { border-bottom: none; }
    .search-list-item:active { opacity: .8; }
    .search-thumb { width: 58px; height: 58px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: var(--bubble); }
    .search-thumb-ph {
      width: 58px; height: 58px; border-radius: 12px;
      background: var(--bubble); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .search-thumb-ph svg { width: 20px; height: 20px; stroke: rgba(255,255,255,.5); }
    .search-item-info { flex: 1; min-width: 0; }
    .search-item-sender { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .search-item-text { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-item-meta { font-size: 11px; color: var(--text-muted); margin-top: 5px; }

    /* ── Detail Screen ── */
    .detail-screen { display: none; position: fixed; inset: 0; background: var(--white); z-index: 150; overflow-y: auto; }
    .detail-screen.open { display: block; }
    .detail-header {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px; position: sticky; top: 0;
      background: var(--white); z-index: 10; border-bottom: 1px solid var(--border);
    }
    .detail-header-title { font-size: 16px; font-weight: 600; flex: 1; }
    .back-btn {
      width: 34px; height: 34px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; border-radius: 50%; flex-shrink: 0;
    }
    .back-btn:hover { background: var(--bg); }
    .back-btn svg { width: 22px; height: 22px; stroke: var(--text); }
    .detail-img-wrap { background: #EDE4DC; display: flex; align-items: center; justify-content: center; min-height: 280px; }
    .detail-img-wrap img { width: 100%; object-fit: contain; display: block; max-height: 500px; }
    .detail-info { padding: 20px; }
    .detail-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .detail-sender { font-size: 18px; font-weight: 700; }
    .detail-date-folder { text-align: right; }
    .detail-date { font-size: 13px; color: var(--text-sub); }
    .detail-folder { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .detail-memo { font-size: 14px; color: var(--text-sub); margin-bottom: 12px; }
    .detail-text { background: var(--bg); border-radius: 14px; padding: 14px 16px; font-size: 13px; line-height: 1.75; }

    /* ── Folder Detail ── */
    .folder-detail-stat {
      background: var(--bg); border-radius: var(--radius-lg);
      padding: 14px 20px; text-align: center; margin: 0 16px 16px;
    }
    .folder-detail-stat-label { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
    .folder-detail-stat-count { font-size: 28px; font-weight: 700; }
    .folder-detail-stat-count span { font-size: 14px; font-weight: 400; color: var(--text-sub); }
    .msg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 16px; }
    .msg-grid-item { border-radius: 14px; overflow: hidden; cursor: pointer; transition: opacity .15s; }
    .msg-grid-item:active { opacity: .8; }
    .msg-grid-thumb { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: var(--bubble); display: block; }
    .msg-grid-ph { width: 100%; aspect-ratio: 3/4; background: var(--bubble); display: flex; align-items: center; justify-content: center; }
    .msg-grid-ph svg { width: 28px; height: 28px; stroke: rgba(255,255,255,.4); }
    .msg-grid-info { background: var(--white); padding: 8px 10px; }
    .msg-grid-sender { font-size: 12px; font-weight: 600; }
    .msg-grid-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ══════════════════════════════════════
       UPLOAD FLOW (3-step full-screen)
    ══════════════════════════════════════ */
    .uf-overlay {
      display: none; position: fixed; inset: 0;
      background: var(--bg); z-index: 200; overflow-y: auto;
      max-width: 430px; left: 50%; transform: translateX(-50%);
    }
    .uf-overlay.open { display: block; }

    .uf-step { display: none; min-height: 100vh; }
    .uf-step.active { display: block; }

    /* Flow header */
    .uf-header {
      display: flex; align-items: center; padding: 16px 20px 12px;
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .uf-header-title { font-size: 16px; font-weight: 600; flex: 1; text-align: center; }
    .uf-header-action {
      font-size: 15px; font-weight: 600; color: var(--accent);
      cursor: pointer; min-width: 36px; text-align: right;
      background: none; border: none; font-family: inherit; padding: 0;
    }

    /* Big title */
    .uf-page-head { padding: 20px 20px 16px; }
    .uf-big-title { font-size: 26px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; }
    .uf-big-sub { font-size: 14px; color: var(--text-sub); line-height: 1.65; }

    /* Bottom sticky CTA */
    .uf-bottom {
      position: sticky; bottom: 0;
      padding: 14px 20px 32px; background: var(--bg);
    }

    /* ── Step 1: Processing ── */
    .uf-proc-card {
      background: var(--white); border-radius: 20px;
      margin: 0 16px 12px; overflow: hidden;
    }
    .uf-proc-card img { width: 100%; max-height: 200px; object-fit: cover; display: block; }
    .uf-proc-bubbles { background: var(--bubble); padding: 14px 16px 16px; }
    .uf-proc-sender-label { font-size: 11px; color: rgba(255,255,255,.65); margin-bottom: 8px; }
    .uf-proc-bubble {
      background: white; border-radius: 4px 14px 14px 14px;
      display: inline-block; padding: 8px 13px; margin-bottom: 5px;
      font-size: 13px; line-height: 1.5; color: var(--text); max-width: 90%;
    }
    .uf-proc-bubble.placeholder { opacity: .45; }

    .uf-progress-row { display: flex; justify-content: flex-end; padding: 8px 20px 4px; }
    .uf-progress-label { font-size: 13px; color: var(--text-sub); }
    .uf-bar-track { height: 4px; background: var(--border); border-radius: 2px; margin: 0 20px; overflow: hidden; }
    .uf-bar { height: 100%; background: var(--accent); border-radius: 2px; width: 0; transition: width .3s; }

    /* ── Step 2: Confirm ── */
    .uf-section-label {
      font-size: 15px; font-weight: 700; padding: 16px 20px 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .uf-badge {
      font-size: 14px; font-weight: 700; color: var(--accent);
    }

    /* Pending card */
    .uf-pending-card {
      background: var(--white); border-radius: 20px;
      margin: 0 16px 12px; overflow: hidden;
    }
    .uf-pending-img { width: 100%; max-height: 180px; object-fit: cover; display: block; }
    .uf-pending-footer {
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .uf-sender-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--accent); color: white;
      border: none; border-radius: var(--radius-pill);
      padding: 8px 16px; font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: opacity .15s;
    }
    .uf-sender-btn:active { opacity: .8; }
    .uf-sender-btn svg { width: 13px; height: 13px; stroke: white; fill: none; }

    /* Done card */
    .uf-done-card {
      background: var(--white); border-radius: 20px;
      margin: 0 16px 12px; overflow: hidden;
    }
    .uf-done-img-wrap { background: var(--bubble); }
    .uf-done-img-wrap img { width: 100%; max-height: 200px; object-fit: cover; display: block; }
    .uf-done-footer {
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .uf-done-senders { display: flex; gap: 14px; flex-wrap: wrap; }
    .uf-done-sender {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; color: var(--text-sub); cursor: pointer;
    }
    .uf-done-sender svg { width: 13px; height: 13px; stroke: var(--text-sub); }

    .uf-date-text { font-size: 13px; color: var(--text-sub); }

    /* ── Step 3: Sender Picker ── */
    .uf-picker-search {
      display: flex; align-items: center; gap: 10px;
      background: var(--white); border-radius: var(--radius-pill);
      padding: 13px 18px; margin: 8px 16px 16px;
    }
    .uf-picker-search input {
      border: none; outline: none; font-family: inherit; font-size: 15px;
      background: transparent; flex: 1; color: var(--text);
    }
    .uf-picker-search input::placeholder { color: var(--text-muted); }
    .uf-picker-search svg { width: 18px; height: 18px; stroke: var(--text-muted); flex-shrink: 0; }

    .uf-picker-section-label { font-size: 14px; font-weight: 600; padding: 4px 20px 10px; }

    .uf-sender-row {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 20px; border-bottom: 1px solid var(--border);
      cursor: pointer; background: var(--white); transition: background .12s;
    }
    .uf-sender-row:last-child { border-bottom: none; }
    .uf-sender-row:active { background: var(--bg); }
    .uf-drag-dots {
      display: grid; grid-template-columns: 1fr 1fr; gap: 3px; flex-shrink: 0;
    }
    .uf-drag-dots span { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); display: block; }
    .uf-name-chip {
      display: inline-block; background: var(--bg);
      border-radius: var(--radius-pill); padding: 5px 14px;
      font-size: 14px; color: var(--text); transition: all .15s;
    }
    .uf-name-chip.sel { background: var(--accent-light); color: var(--accent); }
    .uf-row-dots { margin-left: auto; color: var(--text-muted); font-size: 16px; letter-spacing: 1.5px; }

    .uf-sender-rows-wrap { background: var(--white); border-radius: 0; }

    .uf-new-sender-wrap {
      padding: 16px 20px 32px; display: flex; gap: 10px;
    }
    .uf-new-sender-input {
      flex: 1; border: 1.5px solid var(--border); border-radius: 14px;
      padding: 12px 14px; font-family: inherit; font-size: 14px; outline: none;
      transition: border-color .18s; color: var(--text); background: var(--white);
    }
    .uf-new-sender-input:focus { border-color: var(--accent); }
    .uf-new-sender-btn {
      padding: 12px 20px; border-radius: 14px;
      border: none; background: var(--text); color: white;
      font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity .15s; white-space: nowrap;
    }
    .uf-new-sender-btn:active { opacity: .8; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: rgba(26,26,26,.88); color: white;
      padding: 11px 22px; border-radius: var(--radius-pill);
      font-size: 14px; z-index: 500;
      opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

<!-- ════════════════════ HOME ════════════════════ -->
<div id="homeScreen" class="screen active">
  <header class="header">
    <div class="logo">POOM</div>
    <div class="header-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </div>
  </header>
  <div class="hero-card" onclick="openUpload()">
    <div class="hero-title">간직하고 싶은<br>메시지가 있나요?</div>
    <div class="hero-sub">지금, POOM에 보관하세요</div>
    <div class="hero-arrow"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><polyline points="9 18 15 12 9 6"/></svg></div>
  </div>
  <div class="section-title">최근 받은 마음</div>
  <div id="homeRecent"></div>
  <div class="section-title" style="margin-top:6px">최근 다시 읽은 마음</div>
  <div id="homeReRead"></div>
</div>

<!-- ════════════════════ LIBRARY ════════════════════ -->
<div id="libraryScreen" class="screen">
  <header class="header">
    <div class="logo">POOM</div>
    <div class="header-icons">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </div>
  </header>
  <div class="lib-header">
    <div class="lib-count" id="libCount"><span>0개</span>의 마음이<br>보관되어있어요</div>
  </div>
  <div id="folderList"></div>
</div>

<!-- ════════════════════ SEARCH ════════════════════ -->
<div id="searchScreen" class="screen">

<script>
// ═══════════════════ IndexedDB ═══════════════════
const DB = { name: 'poom_v1', version: 1, store: 'messages' };
let idb;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB.name, DB.version);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB.store)) {
        const s = db.createObjectStore(DB.store, { keyPath: 'id' });
        s.createIndex('sender', 'sender');
        s.createIndex('date', 'date');
        s.createIndex('createdAt', 'createdAt');
      }
    };
    req.onsuccess = e => { idb = e.target.result; res(); };
    req.onerror = () => rej(req.error);
  });
}

function tx(mode = 'readonly') { return idb.transaction(DB.store, mode).objectStore(DB.store); }
const dbGetAll = () => new Promise((r, j) => { const q = tx().getAll(); q.onsuccess = () => r(q.result); q.onerror = () => j(q.error); });
const dbAdd    = item => new Promise((r, j) => { const q = tx('readwrite').add(item); q.onsuccess = () => r(); q.onerror = () => j(q.error); });
const dbPut    = item => new Promise((r, j) => { const q = tx('readwrite').put(item); q.onsuccess = () => r(); q.onerror = () => j(q.error); });

// ═══════════════════ State ═══════════════════
let msgs = [];

// Upload flow state
let ufItems = [];       // [{id, file, imageData, extractedText, detectedSender, confirmedSender, date}]
let ufEditingId = null; // item being edited in sender picker
let ufPickedSender = null; // selection in picker
let ufOcrDone = false;

// ═══════════════════ Init ═══════════════════
async function init() {
  await openDB();
  msgs = await dbGetAll();
  msgs.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  renderHome();
  renderLibrary();
}

function today() { return new Date().toISOString().slice(0, 10); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ═══════════════════ Navigation ═══════════════════
function switchTab(tab) {
  ['home','library','search'].forEach(t => {
    document.getElementById(t+'Screen').classList.toggle('active', t === tab);
    document.getElementById('nav'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active', t === tab);
  });
  if (tab === 'library') renderLibrary();
  if (tab === 'home') renderHome();
}

// ═══════════════════ Home ═══════════════════
function renderHome() {
  const recent = [...msgs].sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt)).slice(0,3);
  const reread = [...msgs].filter(m=>m.lastReadAt).sort((a,b)=>new Date(b.lastReadAt)-new Date(a.lastReadAt)).slice(0,2);

  const rEl = document.getElementById('homeRecent');
  rEl.innerHTML = recent.length ? recent.map(msgCard).join('') : emptyState('아직 보관된 마음이 없어요<br>첫 번째 메시지를 추가해보세요');

  const rrEl = document.getElementById('homeReRead');
  rrEl.innerHTML = reread.length ? reread.map(msgCard).join('') : `<div style="padding:16px 16px 20px; color:var(--text-muted); font-size:13px; text-align:center;">다시 읽은 마음이 없어요</div>`;
}

function msgCard(m) {
  const thumb = m.imageData
    ? `<img class="msg-preview-img" src="${m.imageData}" alt="">`
    : `<div style="height:120px;display:flex;align-items:center;justify-content:center;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
  const preview = m.extractedText
    ? `<div class="chat-bubble">${esc(m.extractedText.slice(0, 60))}${m.extractedText.length>60?'...':''}</div>`
    : (m.memo ? `<div class="chat-bubble">${esc(m.memo)}</div>` : '');
  return `
    <div class="msg-card" onclick="openDetail('${m.id}')">
      <div class="msg-preview">
        <div class="msg-sender-label">${esc(m.sender)}</div>
        ${thumb}${preview}
        ${m.date ? `<div class="chat-time">${m.date}</div>` : ''}
      </div>
      <div class="msg-footer">
        <div class="msg-footer-sender">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          ${esc(m.sender)}
        </div>
        <div class="msg-footer-date">${m.date || ''}</div>
      </div>
    </div>`;
}

function emptyState(text) {
  return `<div class="empty">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
      <circle cx="26" cy="26" r="24" stroke="#E8DDD6" stroke-width="2"/>
      <path d="M14 26 Q26 14 38 26 Q26 38 14 26Z" fill="#E8DDD6"/>
    </svg>
    <div class="empty-sub">${text}</div>
  </div>`;
}

// ═══════════════════ Library ═══════════════════
function renderLibrary() {
  document.getElementById('libCount').innerHTML = `<span>${msgs.length}개</span>의 마음이<br>보관되어있어요`;
  const byFolder = {};
  msgs.forEach(m => { const f = m.folder||'기본'; (byFolder[f]=byFolder[f]||[]).push(m); });
  const entries = Object.entries(byFolder);
  const el = document.getElementById('folderList');
  if (!entries.length) { el.innerHTML = emptyState('아직 보관된 마음이 없어요'); return; }
  const [[fname, fmsgs], ...rest] = entries;
  let html = `
    <div class="active-folder">
      <div class="folder-label">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>기본 폴더
      </div>
      <div class="folder-name">${esc(fname)}</div>
      <div class="folder-big-count">${fmsgs.length} <span>개</span></div>
      <div class="folder-actions">
        <button class="btn-outline" onclick="openFolderDetail('${esc(fname)}')">분석</button>
        <button class="btn-fill"    onclick="openFolderDetail('${esc(fname)}')">편집</button>
      </div>
    </div>`;
  rest.forEach(([n, ms]) => {
    html += `<div class="folder-item" onclick="openFolderDetail('${esc(n)}')"><div class="folder-item-name">${esc(n)}</div><div class="folder-item-count">${ms.length} 개</div></div>`;
  });
  el.innerHTML = html;
}

// ═══════════════════ Upload Flow ═══════════════════
function openUpload() { document.getElementById('fileInput').click(); }

function onFileSelect(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;

  ufItems = files.map(f => ({
    id: uid(), file: f,
    imageData: null, extractedText: '',
    detectedSender: null, confirmedSender: null,
    date: today()
  }));
  ufOcrDone = false;

  document.getElementById('uploadFlow').classList.add('open');
  showStep('processing');
  document.getElementById('ufBar').style.width = '0';

  // Load all images then start OCR
  Promise.all(ufItems.map(item => loadImage(item.file).then(data => {
    item.imageData = data;
    const dm = item.file.name.match(/(\d{4})[-_.]?(\d{2})[-_.]?(\d{2})/);
    if (dm) item.date = `${dm[1]}-${dm[2]}-${dm[3]}`;
  }))).then(() => {
    renderProcCards();
    runAllOCR();
  });
}

function loadImage(file) {
  return new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsDataURL(file); });
}

function renderProcCards() {
  document.getElementById('ufProgressLabel').textContent = `1 / ${ufItems.length}장`;
  document.getElementById('ufProcCards').innerHTML = ufItems.map((item, i) => `
    <div class="uf-proc-card" id="ufProcCard_${i}">
      ${item.imageData ? `<img src="${item.imageData}" alt="">` : ''}
      <div class="uf-proc-bubbles">
        <div class="uf-proc-sender-label" id="ufProcLabel_${i}">인식 중...</div>
        <div class="uf-proc-bubble placeholder">분석하고 있어요</div>
      </div>
    </div>`).join('');
}

async function runAllOCR() {
  for (let i = 0; i < ufItems.length; i++) {
    const item = ufItems[i];
    try {
      const worker = await Tesseract.createWorker('kor+eng', 1, {
        logger: m => {
          if (m.status === 'recognizing text') {
            const overall = (i + m.progress) / ufItems.length;
            document.getElementById('ufBar').style.width = (overall * 100) + '%';
          }
        }
      });
      const { data: { text } } = await worker.recognize(item.imageData);
      await worker.terminate();

      item.extractedText = text;
      item.detectedSender = detectSenderFromText(text);
      item.confirmedSender = item.detectedSender;

      // Update card UI
      const labelEl = document.getElementById(`ufProcLabel_${i}`);
      const bubblesEl = document.getElementById(`ufProcCard_${i}`)?.querySelector('.uf-proc-bubbles');
      if (bubblesEl) {
        const lines = text.split('\n').map(l=>l.trim()).filter(Boolean).slice(0,3);
        bubblesEl.innerHTML = `
          <div class="uf-proc-sender-label">${item.detectedSender ? esc(item.detectedSender) : '보낸 사람 미확인'}</div>
          ${lines.map(l => `<div class="uf-proc-bubble">${esc(l.slice(0,45))}</div>`).join('')}`;
      }
    } catch (err) {
      console.warn('OCR error item', i, err);
    }
    document.getElementById('ufProgressLabel').textContent = `${i+1} / ${ufItems.length}장`;
  }

  document.getElementById('ufBar').style.width = '100%';
  ufOcrDone = true;
  setTimeout(() => goToConfirm(), 600);
}

function goToConfirm() {
  showStep('confirm');
  renderConfirmCards();
}

function showStep(name) {
  ['processing','confirm','senderPicker'].forEach(s => {
    const el = document.getElementById('uf' + s.charAt(0).toUpperCase() + s.slice(1));
    el.classList.toggle('active', s === name);
  });
}

function renderConfirmCards() {
  const pending = ufItems.filter(i => !i.confirmedSender);
  const done    = ufItems.filter(i => i.confirmedSender);

  document.getElementById('ufPendingCount').textContent = pending.length;
  document.getElementById('ufDoneCount').textContent    = done.length;
  document.getElementById('ufPendingSection').style.display = pending.length ? 'block' : 'none';
  document.getElementById('ufDoneSection').style.display    = done.length    ? 'block' : 'none';

  document.getElementById('ufPendingCards').innerHTML = pending.map(item => `
    <div class="uf-pending-card">
      ${item.imageData ? `<img class="uf-pending-img" src="${item.imageData}" alt="">` : ''}
      <div class="uf-pending-footer">
        <button class="uf-sender-btn" onclick="openSenderPicker('${item.id}')">
          <svg viewBox="0 0 24 24" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          보낸 사람
        </button>
        <span class="uf-date-text">${item.date}</span>
      </div>
    </div>`).join('');

  document.getElementById('ufDoneCards').innerHTML = done.map(item => `
    <div class="uf-done-card">
      <div class="uf-done-img-wrap">
        ${item.imageData ? `<img src="${item.imageData}" alt="">` : ''}
      </div>
      <div class="uf-done-footer">
        <div class="uf-done-senders">
          <div class="uf-done-sender" onclick="openSenderPicker('${item.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            ${esc(item.confirmedSender)}
          </div>
        </div>
        <span class="uf-date-text">${item.date}</span>
      </div>
    </div>`).join('');
}

// ═══════════════════ Sender Picker ═══════════════════
function openSenderPicker(itemId) {
  ufEditingId = itemId;
  ufPickedSender = ufItems.find(i => i.id === itemId)?.confirmedSender || null;
  document.getElementById('senderPickerInput').value = '';
  document.getElementById('newSenderInput').value = '';
  showStep('senderPicker');
  renderSenderList(knownSenders());
}

function knownSenders() { return [...new Set(msgs.map(m => m.sender).filter(Boolean))]; }

function renderSenderList(list) {
  const el = document.getElementById('ufSenderList');
  if (!list.length) {
    el.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:14px;">등록된 사람이 없어요</div>`;
    return;
  }
  el.innerHTML = list.map(s => `
    <div class="uf-sender-row" onclick="pickSender('${esc(s)}')">
      <div class="uf-drag-dots">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="uf-name-chip ${ufPickedSender === s ? 'sel' : ''}">${esc(s)}</div>
      <div class="uf-row-dots">···</div>
    </div>`).join('');
}

function filterSenderList(q) {
  const filtered = knownSenders().filter(s => s.includes(q));
  renderSenderList(filtered);
}

function pickSender(name) {
  ufPickedSender = name;
  renderSenderList(knownSenders().filter(s => {
    const q = document.getElementById('senderPickerInput').value;
    return !q || s.includes(q);
  }));
}

function confirmSenderPicker() {
  const manualVal = document.getElementById('newSenderInput').value.trim();
  const chosen = ufPickedSender || manualVal;
  if (!chosen) { showToast('보낸 사람을 선택하거나 입력해주세요'); return; }
  applySender(chosen);
}

function addAndSelect() {
  const val = document.getElementById('newSenderInput').value.trim();
  if (!val) { document.getElementById('newSenderInput').focus(); return; }
  applySender(val);
}

function applySender(name) {
  if (ufEditingId) {
    const item = ufItems.find(i => i.id === ufEditingId);
    if (item) item.confirmedSender = name;
  }
  ufEditingId = null;
  ufPickedSender = null;
  showStep('confirm');
  renderConfirmCards();
}

function closeSenderPicker() {
  ufEditingId = null;
  ufPickedSender = null;
  showStep('confirm');
}

// ═══════════════════ Save ═══════════════════
async function saveAll() {
  if (ufItems.some(i => !i.confirmedSender)) {
    showToast('보낸 사람을 모두 입력해주세요');
    return;
  }
  const btn = document.getElementById('ufSaveBtn');
  btn.disabled = true;
  btn.textContent = '보관중...';
  try {
    for (const item of ufItems) {
      if (!item.imageData) continue;
      const msg = {
        id: uid(),
        sender: item.confirmedSender,
        date: item.date || today(),
        folder: '기본', memo: '',
        imageData: item.imageData,
        extractedText: item.extractedText,
        createdAt: new Date().toISOString(), lastReadAt: null
      };
      await dbAdd(msg);
      msgs.unshift(msg);
    }
    cancelUpload();
    renderHome();
    renderLibrary();
    showToast(`${ufItems.length}개의 마음이 보관되었어요`);
  } catch(e) {
    console.error(e);
    showToast('저장에 실패했어요');
  } finally {
    btn.disabled = false;
    btn.textContent = '저장하기';
  }
}

function cancelUpload() {
  document.getElementById('uploadFlow').classList.remove('open');
  document.getElementById('fileInput').value = '';
  ufItems = []; ufEditingId = null; ufPickedSender = null; ufOcrDone = false;
}

// ═══════════════════ OCR Name Detection ═══════════════════
function detectSenderFromText(text) {
  if (!text) return null;
  const known = knownSenders();

  // 1. Match against known senders
  for (const s of known) {
    if (text.includes(s)) return s;
  }

  // 2. Try each line — clean and extract Korean name
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  for (const line of lines.slice(0, 20)) {
    const name = cleanToName(line);
    if (name) return name;
  }
  return null;
}

function cleanToName(raw) {
  if (!raw) return null;

  // Remove parenthetical annotations: (SDM33기), (33기), (회장) etc.
  let s = raw.replace(/[({[][^)}\]]{0,20}[)}\]]/g, '');
  // Remove English words (SDM, CEO, etc.)
  s = s.replace(/[A-Za-z]+/g, ' ');
  // Remove numbers with/without 기·반·조·팀·기수 suffix
  s = s.replace(/\d+[기반조팀부]?/g, ' ');
  // Remove all non-Korean
  s = s.replace(/[^가-힣\s]/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();

  const words = s.split(' ').filter(w => /^[가-힣]{2,4}$/.test(w));

  // Exclude common non-name words
  const NOT_NAME = new Set([
    '안녕','하세요','감사합니다','고마워','사랑해','파이팅','마음','보관',
    '오늘','내일','어제','그냥','진짜','정말','너무','항상','자주',
    '모두','우리','여기','거기','없는','있는','하는','좋은','나쁜',
    '선생','학생','친구','가족','여자','남자','지금','처음','마지막',
    '메시지','사진','파일','이미지','보낸','받은','확인','카카오','톡',
    '채팅','대화','읽음','전송','일반','개인','그룹',
  ]);

  return words.find(w => !NOT_NAME.has(w)) || null;
}

// ═══════════════════ Detail ═══════════════════
async function openDetail(id) {
  const m = msgs.find(x => x.id === id);
  if (!m) return;
  m.lastReadAt = new Date().toISOString();
  await dbPut(m);

  document.getElementById('detailTitle').textContent = m.sender;
  document.getElementById('detailImg').src = m.imageData || '';
  document.getElementById('detailSender').textContent = m.sender;
  document.getElementById('detailDate').textContent = m.date || '';
  document.getElementById('detailFolder').textContent = m.folder || '기본';

  const memoEl = document.getElementById('detailMemo');
  memoEl.textContent = m.memo || '';
  memoEl.style.display = m.memo ? 'block' : 'none';

  const textEl = document.getElementById('detailText');
  if (m.extractedText && m.extractedText.trim()) {
    textEl.textContent = m.extractedText;
    textEl.style.display = 'block';
  } else {
    textEl.style.display = 'none';
  }
  document.getElementById('detailScreen').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailScreen').classList.remove('open');
  renderHome();
}

// ═══════════════════ Folder Detail ═══════════════════
function openFolderDetail(folderName) {
  const fmsgs = msgs.filter(m => (m.folder||'기본') === folderName)
    .sort((a,b) => new Date(b.date||b.createdAt)-new Date(a.date||a.createdAt));

  document.getElementById('folderDetailTitle').textContent = folderName;
  const body = document.getElementById('folderDetailBody');
  if (!fmsgs.length) {
    body.innerHTML = emptyState('이 폴더에 아직 마음이 없어요');
  } else {
    body.innerHTML = `
      <div class="folder-detail-stat">
        <div class="folder-detail-stat-label">${esc(folderName)}</div>
        <div class="folder-detail-stat-count">${fmsgs.length}<span> 개</span></div>
      </div>
      <div class="msg-grid">
        ${fmsgs.map(m => `
          <div class="msg-grid-item" onclick="openDetail('${m.id}')">
            ${m.imageData ? `<img class="msg-grid-thumb" src="${m.imageData}" alt="${esc(m.sender)}">` : `<div class="msg-grid-ph"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`}
            <div class="msg-grid-info">
              <div class="msg-grid-sender">${esc(m.sender)}</div>
              <div class="msg-grid-date">${m.date||''}</div>
            </div>
          </div>`).join('')}
      </div>`;
  }
  document.getElementById('folderDetailScreen').classList.add('open');
}

function closeFolderDetail() {
  document.getElementById('folderDetailScreen').classList.remove('open');
}

// ═══════════════════ Search ═══════════════════
function doSearch(q) {
  const el = document.getElementById('searchResult');
  if (!q.trim()) {
    el.innerHTML = `<div class="search-empty-wrap"><svg width="160" height="160" viewBox="0 0 160 160" fill="none"><ellipse cx="80" cy="148" rx="34" ry="6" fill="#E8DDD6"/><rect x="55" y="95" width="50" height="56" rx="10" fill="#B8C4CC" opacity=".55"/><circle cx="80" cy="72" r="24" fill="#D4C4BA"/><rect x="28" y="20" width="104" height="50" rx="14" fill="#D8D0C8"/><polygon points="46,70 36,86 60,70" fill="#D8D0C8"/><path d="M77 33 C77 29 73 27 71 30 C69 27 65 29 65 33 C65 37 71 42 71 42 C71 42 77 37 77 33Z" fill="#F4846A" opacity=".7"/></svg></div>`;
    return;
  }
  const ql = q.toLowerCase();
  const found = msgs.filter(m =>
    (m.sender||'').toLowerCase().includes(ql) ||
    (m.extractedText||'').toLowerCase().includes(ql) ||
    (m.memo||'').toLowerCase().includes(ql) ||
    (m.date||'').includes(ql) ||
    (m.folder||'').toLowerCase().includes(ql)
  );
  if (!found.length) {
    el.innerHTML = `<div class="empty" style="padding-top:32px"><div class="empty-sub">"${esc(q)}"로 저장된 마음을 찾지 못했어요</div></div>`;
    return;
  }
  el.innerHTML = `
    <div class="search-result-label">${found.length}개의 마음을 찾았어요</div>
    <div class="search-list">
      ${found.map(m => `
        <div class="search-list-item" onclick="openDetail('${m.id}')">
          ${m.imageData ? `<img class="search-thumb" src="${m.imageData}" alt="">` : `<div class="search-thumb-ph"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`}
          <div class="search-item-info">
            <div class="search-item-sender">${esc(m.sender)}</div>
            <div class="search-item-text">${esc((m.extractedText||m.memo||'').slice(0,48))}</div>
            <div class="search-item-meta">${m.date||''} · ${esc(m.folder||'기본')}</div>
          </div>
        </div>`).join('')}
    </div>`;
}

// ═══════════════════ Toast ═══════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
